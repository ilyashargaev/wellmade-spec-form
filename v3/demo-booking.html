<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Book a call · demo</title>
<link rel="stylesheet" href="wellmade-tokens.css">
<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; background: var(--wm-white); color: var(--wm-ink); }
  .demo { max-width: 520px; margin: 0 auto; padding: 32px 20px 48px; }
  .demo img { display: block; height: 28px; width: auto; }
  .demo .tag { display: inline-block; margin-top: 32px; padding: 4px 10px; border-radius: 999px; background: var(--wm-teal-mist); color: var(--wm-teal); font-size: 13px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase; }
  .demo h1 { margin: 12px 0 0; }
  .demo p { margin: 16px 0 0; font-size: 16px; }
</style>
</head>
<body>
<main class="demo">
  <img src="images/wellmade-logo-teal-grey.png" alt="Wellmade">
  <span class="tag">Demo page</span>
  <h1 class="wm-h2">Book a call with your manager</h1>
  <p>In the real form this link opens the manager's own booking page, where the client picks a time for a call.</p>
  <p>The manager pastes that booking link once, when creating the client's personal link.</p>
  <p>You can close this tab and go back to the form.</p>
</main>
</body>
</html>
